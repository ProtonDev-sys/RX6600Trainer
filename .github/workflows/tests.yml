name: RX 6600 support checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU test dependencies
        run: python -m pip install torch==2.4.1+cpu numpy==1.26.4 --index-url https://download.pytorch.org/whl/cpu
      - name: Runtime, setup and production training regressions (CPU)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Windows PowerShell launcher regressions
        shell: powershell
        run: .\tests\test_launchers.ps1
      - name: PowerShell 7 launcher regressions
        shell: pwsh
        run: .\tests\test_launchers.ps1
